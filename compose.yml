services:
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: ha_sat
    volumes:
      - homeassistant:/config
      - ./custom_components:/config/custom_components
      - ./configuration.yaml:/config/configuration.yaml
    restart: unless-stopped
    network_mode: host

volumes:
  homeassistant: